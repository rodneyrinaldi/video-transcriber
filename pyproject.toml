[project]
name = "video-transcriber"
version = "0.1.0"
description = "Transcreve áudio/vídeo para Markdown (Whisper local + resumo via Ollama na rede)"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.1",
  "av<19",  # av 19 removeu metadata_errors, usado pelo faster-whisper 1.2.1
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
transcrever = "transcritor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transcritor"]
